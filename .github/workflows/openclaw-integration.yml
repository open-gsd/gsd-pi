# OpenClaw × GSD: native host contracts, read seam, and offline package compatibility.
name: OpenClaw Integration

on:
  pull_request:
    paths:
      - 'integrations/openclaw/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'scripts/clean-package-dist.cjs'
      - 'scripts/lib/version-sync.cjs'
      - 'src/web/**'
      - 'web/**'
      - 'scripts/stage-web-standalone.cjs'
      - 'scripts/build-openclaw-web-host.cjs'
      - 'scripts/build-web-if-stale.cjs'
      - 'pnpm-lock.yaml'
      - 'src/read-cli.ts'
      - 'src/headless.ts'
      - 'src/headless-ui.ts'
      - 'src/headless-events.ts'
      - 'packages/mcp-server/**'
      - 'packages/rpc-client/**'
      - '.github/workflows/openclaw-integration.yml'
  push:
    branches:
      - main
    paths:
      - 'integrations/openclaw/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'scripts/clean-package-dist.cjs'
      - 'scripts/lib/version-sync.cjs'
      - 'src/web/**'
      - 'web/**'
      - 'scripts/stage-web-standalone.cjs'
      - 'scripts/build-openclaw-web-host.cjs'
      - 'scripts/build-web-if-stale.cjs'
      - 'pnpm-lock.yaml'
      - 'src/read-cli.ts'
      - 'src/headless.ts'
      - 'src/headless-ui.ts'
      - 'src/headless-events.ts'
      - 'packages/mcp-server/**'
      - 'packages/rpc-client/**'
      - '.github/workflows/openclaw-integration.yml'

permissions:
  contents: read

concurrency:
  group: openclaw-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-tests:
    name: plugin-tests
    timeout-minutes: 30
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'
          cache: 'pnpm'

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          GSD_SKIP_RTK_INSTALL: '1'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build core (gsd read CLI)
        run: pnpm run build:core

      - name: Build host integrations (plugin dist)
        run: pnpm run build:integrations

      - name: Web transport and theme contracts
        run: pnpm --filter gsd-web test

      - name: Install isolated OpenClaw host
        run: npm install --prefix "$RUNNER_TEMP/openclaw-host" --ignore-scripts --no-audit --no-fund --package-lock=false openclaw@2026.9.7

      - name: Native host contract tests (no model calls)
        run: OPENCLAW_BIN="$RUNNER_TEMP/openclaw-host/node_modules/.bin/openclaw" pnpm --filter @opengsd/open-gsd-openclaw test

      - name: Build staged web host
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm run build:web-host && pnpm run build:web-host:openclaw

      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Packed plugin native UI acceptance (isolated Gateway, no model calls)
        env:
          OPENCLAW_BIN: ${{ runner.temp }}/openclaw-host/node_modules/.bin/openclaw
          GSD_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/gsd-browser-proof
        run: node integrations/openclaw/test/browser-host.mjs

      - name: Upload isolated browser proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-browser-proof
          path: ${{ runner.temp }}/gsd-browser-proof
          if-no-files-found: ignore

      - name: OpenClaw plugin compatibility (offline)
        run: |
          mkdir -p /tmp/plugin-inspector && cd /tmp/plugin-inspector
          npm init -y >/dev/null
          npm install --no-audit --no-fund @openclaw/plugin-inspector@0.3.27
          cd "$GITHUB_WORKSPACE/integrations/openclaw"
          /tmp/plugin-inspector/node_modules/.bin/plugin-inspector ci --no-openclaw --runtime --mock-sdk --allow-execute

      - name: OpenClaw plugin compatibility (installed SDK)
        run: /tmp/plugin-inspector/node_modules/.bin/plugin-inspector check --plugin-root "$GITHUB_WORKSPACE/integrations/openclaw" --openclaw "$RUNNER_TEMP/openclaw-host/node_modules/openclaw" --runtime --real-sdk --allow-execute

      - name: Upload plugin-inspector reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-inspector-reports
          path: integrations/openclaw/reports/plugin-inspector-*
          if-no-files-found: ignore
