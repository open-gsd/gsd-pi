name: Coverage report

on:
  pull_request:
    branches: [main, dev, test]
    # No `synchronize`: this is a 90-minute job gated on the `coverage` label.
    # Re-running it on every push to a labeled PR is pure cost — it runs when the
    # label is applied (or the PR reopens), plus the weekly cron below.
    types: [labeled, reopened]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-report:
    name: coverage-report
    timeout-minutes: 90
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'coverage')
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout repository without GITHUB_TOKEN
        shell: bash
        env:
          FETCH_DEPTH: '1'
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git -c protocol.version=2 fetch --no-tags --prune --depth="$FETCH_DEPTH" origin \
            "+${GITHUB_REF}:refs/checkout-ref"
          git checkout --force --detach "$GITHUB_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - uses: ./.github/actions/setup-linux-native-build-deps

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          GSD_SKIP_RTK_INSTALL: '1'
          GSD_SKIP_DEP_REPAIR: '1'
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm run build:core

      # The pinned @opengsd/engine-* npm binary lags the Rust source and is built
      # without the test-fault-injection feature, so the mutation-boundary fault
      # tests would all fail with "setMutationBoundaryFaultForTest is not a
      # function". Build the addon from this commit's Rust source instead (same
      # as the CI test job) and prefer it via GSD_NATIVE_PREFER_LOCAL below.
      - name: Setup Rust toolchain (native addon for tests)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust build (native addon)
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: native-linux-x64-gnu
          workspaces: native -> target

      - name: Build native addon from source (test parity)
        run: pnpm run build:native:test

      - name: Check test coverage thresholds
        env:
          GSD_NATIVE_PREFER_LOCAL: '1'
        run: pnpm run test:coverage

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      # test:coverage:full runs the compiled suites, whose native loader resolves
      # its addon dir relative to dist-test/ — mirror the from-source addon there
      # so the fault-injection tests don't fall back to the stale npm binary.
      - name: Compile test artifacts
        run: pnpm run test:compile

      - name: Mirror native addon into dist-test (compiled-test loader path)
        run: |
          mkdir -p dist-test/native/addon
          cp native/addon/*.node dist-test/native/addon/

      - name: Generate merged coverage report
        env:
          GSD_NATIVE_PREFER_LOCAL: '1'
        run: >-
          pnpm run test:coverage:unit
          && pnpm run test:coverage:integration
          && pnpm run test:coverage:packages
          && pnpm run test:coverage:merge

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/lcov.info
            coverage/file-index.json
          if-no-files-found: error
          retention-days: 14
