# CI workflow — builds, tests, and gates merges to main
name: CI

on:
  push:
    branches: [main, dev, test, 'hotfix/**']
    paths-ignore:
      - '.github/workflows/ai-triage.yml'
      - '.github/workflows/build-native.yml'
      - '.github/workflows/cleanup-dev-versions.yml'
      - 'LICENSE'
  pull_request:
    branches: [main, dev, test]
    paths-ignore:
      - '.github/workflows/ai-triage.yml'
      - '.github/workflows/build-native.yml'
      - '.github/workflows/cleanup-dev-versions.yml'
      - 'LICENSE'
  # Merge queue entries report ci-gate from this event. merge_group does not
  # support path filters, so it is declared bare rather than mirroring the
  # paths-ignore lists above.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  # Group per-PR (pull_request.number is globally unique — head_ref is only the
  # source branch name, which collides across forks/PRs that share it) so pushing
  # to a PR cancels its own stale run, and fall back to the unique run_id on
  # branch pushes so an in-flight main/dev CI is never cancelled by a later push.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Single checkout + classify + fast scans (~2–5 min). Replaces detect-changes,
  # docs-check, and lint jobs so build can start as soon as this finishes.
  fast-gates:
    name: fast-gates
    timeout-minutes: 15
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      heavy-code-changed: ${{ steps.classify.outputs.heavy-code-changed }}
      web-changed: ${{ steps.classify.outputs.web-changed }}
      portability-changed: ${{ steps.classify.outputs.portability-changed }}
      windows-e2e-changed: ${{ steps.classify.outputs.windows-e2e-changed }}
      docker-changed: ${{ steps.classify.outputs.docker-changed }}
    steps:
      - name: Checkout repository without GITHUB_TOKEN
        shell: bash
        env:
          FETCH_DEPTH: '0'
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git -c protocol.version=2 fetch --no-tags --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            "+${GITHUB_SHA}:refs/checkout-ref"
          git checkout --force --detach "$GITHUB_SHA"

      - name: Prepare diff base for scans
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-fetch-diff-base.sh

      - name: Classify changed files
        id: classify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci-classify-changes.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          GSD_SKIP_RTK_INSTALL: '1'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run fast gates
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-fast-gates.sh

  build:
    name: build
    # Raised from 25: this job compiles the native engine addon from source
    # (a cold Rust build) before running the native-backed test suites.
    timeout-minutes: 45
    needs: [fast-gates]
    if: needs.fast-gates.outputs.heavy-code-changed == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      # native/.cargo/config.toml sets `-C target-cpu=native` for local dev speed,
      # which bakes host-specific CPU instructions into build artifacts, including
      # the proc-macro .so files (e.g. napi_derive) that rustc dlopens during macro
      # expansion. On the heterogeneous CI runner fleet those artifacts can be
      # executed on a CPU that lacks the instructions they were built for, crashing
      # rustc with `interrupted by SIGILL` (as seen expanding gsd_ast). Override
      # RUSTFLAGS to a portable baseline for CI, exactly as that config file's own
      # "CI/release builds should override via RUSTFLAGS for portability" note directs.
      RUSTFLAGS: '-C target-cpu=x86-64'

    steps:
      - name: Checkout repository without GITHUB_TOKEN
        shell: bash
        env:
          FETCH_DEPTH: '1'
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git -c protocol.version=2 fetch --no-tags --prune --depth="$FETCH_DEPTH" origin \
            "+${GITHUB_SHA}:refs/checkout-ref"
          git checkout --force --detach "$GITHUB_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - uses: ./.github/actions/setup-linux-native-build-deps

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          GSD_SKIP_RTK_INSTALL: '1'
          GSD_SKIP_DEP_REPAIR: '1'
        run: pnpm install --frozen-lockfile

      # The native engine (@opengsd/engine-*) is published only at release time,
      # so the pinned npm binary lags the Rust source in native/crates/engine.
      # When native code changes (e.g. new N-API exports), the tests below must
      # run against the addon built from THIS commit, not the stale published
      # binary. Build it from source and load it via GSD_NATIVE_PREFER_LOCAL=1
      # on the test steps. The built .node is packed into ci-build-artifacts so
      # node22-smoke reuses it without re-compiling.
      - name: Setup Rust toolchain (native addon for tests)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust build (native addon)
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: native-linux-x64-gnu
          workspaces: native -> target

      - name: Build native addon from source (test parity)
        # Dev profile: faster to compile and the profile the @gsd/native package
        # tests already use. GSD_NATIVE_PREFER_LOCAL loads gsd_engine.dev.node.
        run: pnpm run build:native:test

      - name: Build core
        run: pnpm run build:core

      - uses: ./.github/actions/cache-nextjs

      # validate-pack requires dist/web/standalone/server.js in the tarball (package.json files).
      - name: Build web host
        run: pnpm run build:web-host

      - name: Pack build artifacts
        run: bash scripts/ci-pack-build-artifacts.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ci-build-artifacts
          path: ci-build-artifacts.tar.gz
          retention-days: 1

      - name: Typecheck extensions
        run: pnpm run typecheck:extensions

      - name: Validate package is installable
        run: pnpm run validate-pack

      - name: Verify workspace coverage (every linkable package has tests)
        run: pnpm run verify:workspace-coverage

      - name: Verify extension coverage (parity with verify:merge)
        run: pnpm run verify:extension-coverage

      - name: Compile test artifacts
        run: pnpm run test:compile

      # The compiled-test native loader (dist-test/packages/native/dist/native.js)
      # resolves its addon dir relative to its own location, i.e. dist-test/native/addon.
      # Mirror the from-source addon there so GSD_NATIVE_PREFER_LOCAL=1 finds it for
      # the compiled unit/package suites (build:native only writes repo-root native/addon).
      - name: Mirror native addon into dist-test (compiled-test loader path)
        run: |
          mkdir -p dist-test/native/addon
          cp native/addon/*.node dist-test/native/addon/
          ls -la dist-test/native/addon/

      - name: Run unit tests
        env:
          GSD_NATIVE_PREFER_LOCAL: '1'
        run: pnpm run test:unit:compiled

      - name: Run package tests
        env:
          GSD_NATIVE_PREFER_LOCAL: '1'
          GSD_SKIP_NATIVE_PACKAGE_TESTS: ${{ needs.fast-gates.outputs.portability-changed == 'true' && '0' || '1' }}
        run: pnpm run test:packages:compiled

      - name: Run pi-ai vitest suite
        run: pnpm --filter @gsd/pi-ai test

      - name: Run daemon package tests
        run: pnpm run test:daemon

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run integration tests
        env:
          GSD_NATIVE_PREFER_LOCAL: '1'
        run: pnpm run test:integration

      - name: Run e2e suite (against built binary)
        env:
          GSD_NATIVE_PREFER_LOCAL: '1'
        run: |
          chmod +x dist/loader.js
          GSD_SMOKE_BINARY="$(pwd)/dist/loader.js"
          export GSD_SMOKE_BINARY
          pnpm run test:e2e

      - name: Run docker e2e suite
        if: needs.fast-gates.outputs.docker-changed == 'true'
        run: pnpm run test:e2e:docker

      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: test-results/e2e
          if-no-files-found: ignore
          retention-days: 7

  windows-portability:
    name: windows-portability
    # Raised from 25: this job now compiles the native engine addon from source
    # (a cold Rust build) before running the native-backed portability tests.
    timeout-minutes: 45
    env:
      # Same heterogeneous-runner guard as the build job: without a portable
      # target-cpu baseline, rustc artifacts built on one fleet member crash
      # rustc on another with STATUS_ILLEGAL_INSTRUCTION (observed expanding
      # gsd_ast on #2066's run and once on main).
      RUSTFLAGS: '-C target-cpu=x86-64'
    needs: [fast-gates, build]
    if: >-
      needs.fast-gates.outputs.heavy-code-changed == 'true' &&
      (needs.fast-gates.outputs.portability-changed == 'true' ||
       needs.fast-gates.outputs.windows-e2e-changed == 'true')
    runs-on: blacksmith-4vcpu-windows-2025

    steps:
      - name: Checkout repository without GITHUB_TOKEN
        shell: bash
        env:
          FETCH_DEPTH: '1'
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git -c protocol.version=2 fetch --no-tags --prune --depth="$FETCH_DEPTH" origin \
            "+${GITHUB_SHA}:refs/checkout-ref"
          git checkout --force --detach "$GITHUB_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          GSD_SKIP_RTK_INSTALL: '1'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: ./.github/actions/restore-ci-build-artifacts

      # Build the native engine addon from THIS commit's Rust source so the
      # Windows-native file-identity/directory-sync code paths are exercised
      # against real N-API exports, not the stale published engine binary.
      - name: Setup Rust toolchain (native addon for tests)
        if: needs.fast-gates.outputs.portability-changed == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust build (native addon)
        if: needs.fast-gates.outputs.portability-changed == 'true'
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: native-win32-x64-msvc
          workspaces: native -> target

      - name: Build native addon from source (test parity)
        if: needs.fast-gates.outputs.portability-changed == 'true'
        # Dev profile: faster to compile and the profile the @gsd/native package
        # tests already use. GSD_NATIVE_PREFER_LOCAL loads gsd_engine.dev.node.
        run: pnpm run build:native:test

      - name: Typecheck extensions
        if: needs.fast-gates.outputs.portability-changed == 'true'
        run: pnpm run typecheck:extensions

      - name: Run package tests
        if: needs.fast-gates.outputs.portability-changed == 'true'
        env:
          GSD_NATIVE_PREFER_LOCAL: '1'
        run: pnpm run test:packages

      - name: Run Windows portability tests
        if: needs.fast-gates.outputs.portability-changed == 'true'
        env:
          GSD_NATIVE_PREFER_LOCAL: '1'
        run: >-
          node --import ./src/resources/extensions/gsd/tests/resolve-ts.mjs
          --experimental-strip-types --test
          src/tests/windows-portability.test.ts
          src/resources/extensions/gsd/tests/validate-directory.test.ts
          src/tests/integration/web-mode-windows-hide.test.ts

      - name: Run Windows e2e smoke suite (non-blocking)
        id: windows-smoke-e2e
        if: needs.fast-gates.outputs.windows-e2e-changed == 'true'
        timeout-minutes: 10
        shell: bash
        continue-on-error: true
        run: |
          GSD_SMOKE_BINARY="$(pwd)/dist/loader.js"
          export GSD_SMOKE_BINARY
          pnpm run test:e2e:windows-smoke

      - name: Flag Windows e2e smoke failure
        # continue-on-error keeps this non-blocking, but a silent failure means a
        # broken Windows loader stays green forever. Surface it as an annotation.
        if: steps.windows-smoke-e2e.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=Windows e2e smoke failed::The non-blocking Windows e2e smoke suite failed. See the e2e-artifacts-windows artifact."

      - name: Upload Windows e2e artifacts on failure
        if: steps.windows-smoke-e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-windows
          path: test-results/e2e
          if-no-files-found: ignore
          retention-days: 7

  # Validate the strictest declared workspace engines floor (currently ">=22.19.0").
  # The main build/test lanes run on Node 24, so without this lane the supported
  # minor (22.x) is never exercised. Cheap: reuse the build artifacts and just run
  # the smoke suite against the built binary on Node 22.
  node22-smoke:
    name: node22-smoke
    timeout-minutes: 15
    needs: [fast-gates, build]
    if: needs.fast-gates.outputs.heavy-code-changed == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout repository without GITHUB_TOKEN
        shell: bash
        env:
          FETCH_DEPTH: '1'
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git -c protocol.version=2 fetch --no-tags --prune --depth="$FETCH_DEPTH" origin \
            "+${GITHUB_SHA}:refs/checkout-ref"
          git checkout --force --detach "$GITHUB_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.12.1

      - name: Setup Node.js 22 (engines floor)
        uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: 'pnpm'

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          GSD_SKIP_RTK_INSTALL: '1'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: ./.github/actions/restore-ci-build-artifacts

      - name: Run smoke suite on Node 22
        shell: bash
        env:
          # Load the from-source native addon restored from ci-build-artifacts
          # (native/addon/*.node), not the stale published engine binary.
          GSD_NATIVE_PREFER_LOCAL: '1'
        run: |
          chmod +x dist/loader.js
          GSD_SMOKE_BINARY="$(pwd)/dist/loader.js"
          export GSD_SMOKE_BINARY
          pnpm run test:smoke

      - name: Verify SQLite close behavior on Node 22
        run: >-
          node --import ./src/resources/extensions/gsd/tests/resolve-ts.mjs
          --experimental-strip-types --test
          src/resources/extensions/gsd/tests/db-provider.test.ts

  # Single aggregate gate. Make THIS the only required status check in branch
  # protection. Because it always runs, branch protection always has a concrete
  # pass/fail signal — a conditionally-skipped `build`/`windows-portability` job
  # can no longer read as a neutral "required check never reported" state.
  workflow-lint:
    name: workflow-lint
    timeout-minutes: 5
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout repository without GITHUB_TOKEN
        shell: bash
        env:
          FETCH_DEPTH: '0'
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -c protocol.version=2 fetch --no-tags --prune origin \
            "+${GITHUB_SHA}:refs/checkout-ref"
          git checkout --force --detach "$GITHUB_SHA"

      - name: Run actionlint
        run: |
          set -euo pipefail
          # Pinned: actionlint is the static-analysis gate for GitHub Actions
          # workflows; runner-label exceptions live in actionlint.yaml.
          ACTIONLINT_VERSION=v1.7.7
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin actionlint
          actionlint -config-file .config/actionlint.yaml

  ci-gate:
    name: ci-gate
    if: always()
    needs: [fast-gates, build, windows-portability, node22-smoke, workflow-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Assert no upstream job failed or was cancelled
        env:
          FAST_GATES: ${{ needs.fast-gates.result }}
          BUILD: ${{ needs.build.result }}
          WINDOWS: ${{ needs.windows-portability.result }}
          NODE22: ${{ needs.node22-smoke.result }}
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
        shell: bash
        run: |
          set -euo pipefail
          echo "fast-gates=$FAST_GATES build=$BUILD windows-portability=$WINDOWS node22-smoke=$NODE22 workflow-lint=$WORKFLOW_LINT"
          # 'skipped' is an acceptable result (job legitimately not needed).
          # Only 'failure' / 'cancelled' must block the merge.
          status=0
          for result in "$FAST_GATES" "$BUILD" "$WINDOWS" "$NODE22" "$WORKFLOW_LINT"; do
            case "$result" in
              success|skipped) ;;
              *) status=1 ;;
            esac
          done
          if [ "$status" -ne 0 ]; then
            echo "::error title=CI gate failed::One or more required CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All required CI jobs passed (or were legitimately skipped)."
