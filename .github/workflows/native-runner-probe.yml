# Minimal runner probe: records the macOS image and architecture only.
# Runs no repository code beyond printing identity. Delete after the probe.
name: Native runner probe (macOS)

on:
  # push runs on the feature branch so the probe starts without changing the
  # default branch (workflow_dispatch requires the workflow to exist on default).
  push:
    branches: [fix/w067-native-harness-ci-3161]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: runner probe (macos-15)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Record runner provenance
        shell: bash
        run: |
          set -uo pipefail
          echo "sw_vers:"; sw_vers || true
          echo "uname -m: $(uname -m)"
          echo "runner.os=$RUNNER_OS runner.arch=$RUNNER_ARCH"
          echo "image.os=${ImageOS:-unset} image.version=${ImageVersion:-unset}"
          echo "node: $(node --version 2>/dev/null || echo missing)"
          echo "pnpm: $(pnpm --version 2>/dev/null || echo missing)"
