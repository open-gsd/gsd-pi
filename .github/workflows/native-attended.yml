# Opt-in native attended fixture run on macOS.
#
# Why a separate workflow: ci.yml's concurrency group cancels an older run of the
# same PR when a newer one starts. A label event started a second pull_request run,
# which cancelled the macOS job before any step ran (run 43146187147). This workflow
# has its own concurrency group, so it is never superseded by ci.yml.
name: Native attended (macOS)

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Full commit SHA to test (must be the PR head or a descendant)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-attended-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  native-attended:
    # Opt-in: run for PRs that carry the label, or on manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'native-harness')
    name: native-attended (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Resolve tested source SHA
        id: sha
        shell: bash
        env:
          INPUT_SHA: ${{ github.event.inputs.source_sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-$PR_HEAD}"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::tested SHA is not a full 40-char commit SHA: '$sha'"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Testing source SHA: $sha"

      - name: Checkout tested SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.sha.outputs.sha }}
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        env:
          EXPECTED: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::checkout HEAD $actual != expected $EXPECTED"
            exit 1
          fi
          echo "checkout HEAD verified: $actual"

      - uses: ./.github/actions/pre-review-node-setup

      - name: Build native package (dependency-first, before tests)
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build:native-pkg
          test -f packages/native/dist/directory-sync/index.js

      - name: Test native fixture builder
        run: node --test scripts/__tests__/build-native-fixture-package.test.mjs

      - name: Build native attended fixture package
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture_package="$(node scripts/build-native-fixture-package.mjs)"
          if [ ! -d "$fixture_package" ]; then
            echo "::error::fixture package not created: $fixture_package"
            exit 1
          fi
          echo "W067_NATIVE_FIXTURE_PACKAGE=$fixture_package" >> "$GITHUB_ENV"
          echo "fixture=$fixture_package" >> "$GITHUB_OUTPUT"

      - name: Run native attended fixtures
        shell: bash
        run: |
          set -uo pipefail
          # Capture the real exit code. A failed or cancelled fixture run must fail
          # this step; it is never converted into a skip or a pass.
          node --import tsx --test --test-concurrency=1 src/tests/coordination-maintenance-attended.test.ts \
            > native-attended.tap.log 2>&1
          rc=$?
          tail -20 native-attended.tap.log
          if [ "$rc" -ne 0 ]; then
            echo "::error::native attended fixtures failed (exit $rc)"
            exit "$rc"
          fi

      - name: Record provenance
        if: always()
        shell: bash
        run: |
          {
            echo "source_sha=${{ steps.sha.outputs.sha }}"
            echo "runner=$(uname -s) $(uname -m)"
            echo "node=$(node --version)"
            echo "fixture=${{ steps.fixture.outputs.fixture }}"
          } > native-attended.provenance.txt
          tail -n +1 native-attended.provenance.txt

      - name: Upload logs and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-attended-${{ steps.sha.outputs.sha }}
          path: |
            native-attended.tap.log
            native-attended.provenance.txt
          if-no-files-found: warn

      - name: Clean native attended fixture package
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${W067_NATIVE_FIXTURE_PACKAGE:-}" ]; then
            node -e 'require("fs").rmSync(process.argv[1],{recursive:true,force:true})' "$W067_NATIVE_FIXTURE_PACKAGE"
          fi
